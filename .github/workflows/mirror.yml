name: Mirror to Forgejo

on:
  schedule:
    # Run every day at 1 pm
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream
        run: |
          if [ ! -d upstream ]; then
            git clone --mirror https://github.com/StellarwhimsRepo/ValheimMods.git upstream
          else
            cd upstream
            git fetch --all
          fi
          cd upstream
          git remote add target https://StellarWhimsRepo:${{ secrets.VALHEIMMODS_FORGJOMIRROR }}@forgejo.stellarwhims.com/StellarwhimsRepo/ValheimMods_Mirror.git
          git push target --mirror
