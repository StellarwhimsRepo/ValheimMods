name: Sync Fork

on:
  schedule:
    # Run every 6 hours
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.FORKSYNC_PAT }}
          
      - name: Add upstream
        run: |
          git remote add upstream https://github.com/RandyKnapp/ValheimMods.git
          git fetch upstream

      - name: Merge upstream
        run: |
          git checkout main
          git merge upstream/main
          git push origin main
